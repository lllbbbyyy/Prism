[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-cost-model"
version = "0.1.0"
description = "Prism: Agent-Collaborative Hybrid Cost Model Design for AI Accelerators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["prism*"]
